name: Verify Aegis
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:voice-ui
      - run: npm run test:live-desk
      - run: npm run test:plugins
      - run: npm run package
      - run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Windows
          path: release/*.exe
          retention-days: 14
